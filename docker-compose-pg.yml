services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: postgres18

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: appdb

    ports:
      - "5300:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  default:
    name: ai-infra

volumes:
  postgres_data: